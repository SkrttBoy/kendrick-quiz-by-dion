<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kendrick Lamar Quiz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #222;
            color: white;
        }
        .quiz-container {
            width: 50%;
            margin: 100px auto;
            padding: 20px;
            border-radius: 10px;
            background-color: #333;
            box-shadow: 0px 0px 10px rgba(255, 255, 255, 0.2);
        }
        button {
            background-color: #ff4500;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-top: 10px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #ff6347;
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <h1>Kendrick Lamar Quiz</h1>
        <p id="question">Loading...</p>
        <div id="options"></div>
        <button id="next-btn" onclick="nextQuestion()">Next</button>
        <p id="score"></p>
    </div>

    <script>
        const questions = [
            {
                question: "What is Kendrick Lamar's full name?",
                options: ["A. Kendrick Lamar Duckworth", "B. Lamar Kendrick Duckworth", "C. Kendrick Duckworth Lamar"],
                answer: "A"
            },
            {
                question: "Which Kendrick Lamar album won the Pulitzer Prize for Music?",
                options: ["A. DAMN.", "B. To Pimp a Butterfly", "C. good kid, m.A.A.d city"],
                answer: "A"
            },
            {
                question: "Which movie soundtrack did Kendrick Lamar contribute to?",
                options: ["A. Black Panther", "B. The Avengers", "C. Fast & Furious"],
                answer: "A"
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById("question").innerText = q.question;
            let optionsHtml = "";
            q.options.forEach((opt, index) => {
                optionsHtml += `<button onclick="checkAnswer('${String.fromCharCode(65 + index)}')">${opt}</button><br>`;
            });
            document.getElementById("options").innerHTML = optionsHtml;
        }

        function checkAnswer(answer) {
            if (answer === questions[currentQuestion].answer) {
                score++;
                alert("Correct!");
            } else {
                alert("Oops! The correct answer is " + questions[currentQuestion].answer);
            }
            nextQuestion();
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                document.getElementById("question").innerText = "Quiz Complete!";
                document.getElementById("options").innerHTML = "";
                document.getElementById("score").innerText = `You scored ${score} out of ${questions.length}!`;
                document.getElementById("next-btn").style.display = "none";
            }
        }

        window.onload = loadQuestion;
    </script>
</body>
</html>
